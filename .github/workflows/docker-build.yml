# Build the Jetson-oriented Dockerfile on every pull request.
# Uses ubuntu-24.04-arm so the image matches aarch64/sbsa (NVIDIA keyring + ld.so path in Dockerfile).
# Note: GitHub-hosted ARM runners require a public repo (or paid larger runners); private repos may need self-hosted arm64 or buildx+qemu.

name: Docker build

on:
  push:
    branches: [jetson]
  pull_request: 
    branches: [jetson]

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t tfc-jetson:ci .
